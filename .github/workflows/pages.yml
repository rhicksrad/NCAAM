name: Deploy

# Rebuilds on every push to main and on a timer, so the baked ESPN snapshot
# that pages paint from first is never more than about half an hour old.
# The build runs on Ryan's PCs when CI_RUNNER is "local"; the deploy itself is
# always hosted, which keeps the Pages deploy token off the PCs.
on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER == 'local' && fromJSON('["self-hosted","web-trusted"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Per-runner install: the default (~/setup-pnpm) is shared by every
          # runner on the same machine and they trample each other mid-job.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run budget
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Leave the runner tidy
        if: always() && runner.environment == 'self-hosted'
        run: rm -rf dist .cache node_modules
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
